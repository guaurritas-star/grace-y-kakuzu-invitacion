<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grace & Kakuzu están de fiesta</title>
<meta name="theme-color" content="#f6eee8">
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{
  --bg:#f6eee8; --paper:#fffaf6; --ink:#2f2a2b;
  --rose:#d98f9d; --rose-dark:#b86677; --sage:#768e78; --sage-dark:#526a56;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.75),transparent 30%),linear-gradient(180deg,#f8f1ec 0%,#f3e9e2 100%);
}
.wrap{max-width:720px;margin:auto;min-height:100vh;padding-bottom:48px}
.hero{position:relative;overflow:hidden}
.hero img{width:100%;height:58vh;min-height:420px;max-height:650px;object-fit:cover;display:block;filter:saturate(.95) contrast(1.02)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03) 25%,rgba(0,0,0,.22) 72%,rgba(246,238,232,.98) 100%)}
.hero-copy{position:absolute;left:24px;right:24px;bottom:30px;z-index:2;color:white;text-shadow:0 2px 20px rgba(0,0,0,.30)}
.eyebrow{font-size:.82rem;letter-spacing:.20em;text-transform:uppercase;font-weight:800}
h1{margin:.38rem 0 .55rem;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.7rem,11vw,5rem);line-height:.9}
.hero-copy p{font-size:1.08rem;margin:0;font-weight:700}
.card{background:rgba(255,250,246,.94);backdrop-filter:blur(12px);margin:18px 16px 0;border:1px solid rgba(255,255,255,.8);border-radius:26px;padding:24px;box-shadow:0 14px 45px rgba(94,67,56,.10)}
.intro{text-align:center}.kicker{font-family:Georgia,"Times New Roman",serif;font-size:1.55rem;margin:0 0 8px}.intro p{margin:.35rem 0;color:#5f5553;line-height:1.55}
.details{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}.detail{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:18px;padding:14px 16px;border:1px solid #f0e5df;text-align:left}.icon{font-size:1.35rem;line-height:1}.detail b{display:block;font-size:.95rem;margin-bottom:2px}.detail span{font-size:.95rem;color:#655b58;line-height:1.35}
.btns{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}button,a.btn{appearance:none;border:0;border-radius:18px;padding:16px 18px;font-size:1rem;font-weight:850;text-decoration:none;text-align:center;cursor:pointer;display:block;transition:.2s transform,.2s opacity}button:active,a.btn:active{transform:scale(.985)}.yes{background:var(--sage);color:white}.no{background:var(--rose);color:white}.map{background:#fff;color:#463e3d;border:1px solid #e7d9d0;margin-top:12px}.small{font-size:.83rem;color:#756b68;text-align:center;margin-top:12px;line-height:1.4}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.countdown div{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;border:1px solid #f0e5df}.countdown strong{font-family:Georgia,serif;font-size:1.55rem;display:block}.countdown span{font-size:.72rem;color:#7b6f6c;text-transform:uppercase;letter-spacing:.08em}
.gift-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.gift{background:#fff;border:1px solid #f0e5df;border-radius:18px;padding:16px;text-align:center}.gift .emoji{font-size:2rem;margin-bottom:6px}.gift b{display:block;margin-bottom:2px}.gift span{font-size:.8rem;color:#786e6b}
footer{text-align:center;color:#7c706d;padding:28px 24px 0;font-family:Georgia,serif;font-style:italic}
.modal{position:fixed;inset:0;background:rgba(30,25,25,.48);display:none;align-items:flex-end;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.sheet{width:min(100%,680px);background:#fffaf6;border-radius:26px 26px 20px 20px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.24)}.sheet h2{font-family:Georgia,serif;margin:0 0 8px}.sheet p{margin:0 0 14px;color:#655b58;line-height:1.45}.sheet input{width:100%;border:1px solid #dfd2ca;border-radius:14px;padding:14px;font-size:1rem;margin-bottom:10px;background:white}.sheet .actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:4px}.ghost{background:#eee3dc;color:#4d4442}
@media(min-width:560px){.details{grid-template-columns:1fr 1fr}.btns{grid-template-columns:1fr 1fr}.gift-grid{grid-template-columns:repeat(3,1fr)}}
.start-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.92),transparent 35%),linear-gradient(180deg,#f8f1ec 0%,#efe1d8 100%)}
.start-card{width:min(100%,560px);text-align:center;background:rgba(255,250,246,.96);border:1px solid rgba(255,255,255,.9);border-radius:32px;padding:34px 24px;box-shadow:0 24px 70px rgba(94,67,56,.16)}
.start-paws{font-size:2rem;margin-bottom:10px}.start-card .pretitle{text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;font-weight:800;color:#7a6e6b}.start-card h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.2rem,10vw,4.2rem);line-height:.95;margin:14px 0 10px;color:#3a3231}.start-card p{color:#746966;margin:0 0 20px}.start-card button{width:100%}.invite-hidden{display:none}.status-box{display:none;margin-top:14px;padding:14px;border-radius:16px;background:#fff;border:1px solid #f0e5df;color:#5e5552;text-align:center}.status-box.show{display:block}.no-cats{display:none;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}.no-cats.show{display:grid}.no-cats img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:20px;background:white;border:1px solid #f0e5df}
</style>
</head>
